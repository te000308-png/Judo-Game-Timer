# index.html を GitHub Pages へ公開する。
# configure-pages の enablement: true により、Pages が未設定でも
# ワークフロー側から有効化される（設定画面の操作は不要）。
name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/judo-match-timer-ui-loakyo"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。実行中のものは終わらせてから次を流す。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages を有効化して設定
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 公開する内容をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v4
